<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Customer Account</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(
                    circle at top left,
                    #333 0,
                    #111 35%,
                    #050505 75%
                );
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .auth-container {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand p {
            margin-top: 7px;
            color: #aaa;
            font-size: 14px;
        }

        .auth-card {
            background: #fff;
            color: #111;
            border-radius: 22px;
            padding: 32px;
            box-shadow:
                0 25px 70px rgba(0,0,0,.35);
        }

        .store-name {
            text-align: center;
            font-size: 13px;
            color: #777;
            margin-bottom: 24px;
        }

        .tabs {
            display: flex;
            background: #f2f2f2;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .tab {
            flex: 1;
            border: none;
            background: transparent;
            padding: 11px;
            border-radius: 9px;
            font-weight: 700;
            cursor: pointer;
            color: #777;
        }

        .tab.active {
            background: #111;
            color: #fff;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 11px;
            padding: 13px 14px;
            font-size: 14px;
            outline: none;
            transition: .2s;
        }

        input:focus {
            border-color: #111;
            box-shadow: 0 0 0 3px rgba(0,0,0,.06);
        }

        .submit-btn {
            width: 100%;
            border: none;
            border-radius: 12px;
            background: #111;
            color: #fff;
            padding: 14px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 5px;
        }

        .submit-btn:hover {
            opacity: .9;
        }

        .submit-btn:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: #fff0f0;
            color: #a00000;
        }

        .message.success {
            background: #effaf1;
            color: #16702a;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #aaa;
            font-size: 13px;
            text-decoration: none;
        }

        .back-link:hover {
            color: #fff;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 500px) {

            body {
                padding: 15px;
            }

            .auth-card {
                padding: 24px 20px;
            }

            .brand h1 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>

<div class="auth-container">

    <div class="brand">

        <h1>Customer Account</h1>

        <p>
            Login to continue shopping
        </p>

    </div>


    <div class="auth-card">

        <div
            class="store-name"
            id="storeName"
        >
            Loading store...
        </div>


        <div class="tabs">

            <button
                type="button"
                class="tab active"
                id="loginTab"
            >
                Login
            </button>

            <button
                type="button"
                class="tab"
                id="signupTab"
            >
                Create Account
            </button>

        </div>


        <div
            class="message"
            id="message"
        ></div>


        <!-- LOGIN -->

        <form id="loginForm">

            <div class="form-group">

                <label for="loginEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Your password"
                    required
                >

            </div>

            
<div class="form-group" id="loginFullNameGroup" style="display:none;">

    <label for="loginFullName">Full Name</label>

    <input
        type="text"
        id="loginFullName"
        placeholder="Enter your full name"
    >

    <small style="display:block; margin-top:6px; color:#777;">
        We need your name to finish setting up your customer account.
    </small>

</div>



            <button
                type="submit"
                class="submit-btn"
                id="loginButton"
            >
                Login
            </button>

        </form>

        
<button
    type="button"
    id="resendConfirmationButton"
    style="display:none; width:100%; margin-top:12px; padding:12px; border:1px solid #ddd; border-radius:12px; background:#fff; cursor:pointer;"
>
    Resend Confirmation Email
</button>


        <!-- SIGN UP -->

        <form
            id="signupForm"
            class="hidden"
        >

            <div class="form-group">

                <label for="fullName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="signupEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="08012345678"
                    required
                >

            </div>


            <div class="form-group">

                <label for="address">
                    Delivery Address
                </label>

                <input
                    type="text"
                    id="address"
                    placeholder="Your delivery address"
                    required
                >

            </div>


            <div class="form-group">

                <label for="signupPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="At least 6 characters"
                    minlength="6"
                    required
                >

            </div>


            <button
                type="submit"
                class="submit-btn"
                id="signupButton"
            >
                Create Account
            </button>

        </form>


        <a
            href="#"
            class="back-link"
            id="backToStore"
        >
            ← Back to store
        </a>

    </div>

</div>



<script>
    // =========================
    // SUPABASE CONFIGURATION
    // =========================

    const SUPABASE_URL =
        "https://difamwnbnfjevvgcprig.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_pETuvhi__8zgCn2_Vc19BQ_IeW2PfLl";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
            }
        }
    );

    // =========================
    // STORE INFORMATION
    // =========================

    const urlParams = new URLSearchParams(window.location.search);
    const storeSlug = urlParams.get("store");

    let currentStore = null;
    let nameCompletionRequired = false;

    // =========================
    // ELEMENTS
    // =========================

    const storeName = document.getElementById("storeName");
    const message = document.getElementById("message");

    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");

    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");

    const loginButton = document.getElementById("loginButton");
    const signupButton = document.getElementById("signupButton");

    const backToStore = document.getElementById("backToStore");

    const resendConfirmationButton =
        document.getElementById("resendConfirmationButton");

    const loginFullNameGroup =
        document.getElementById("loginFullNameGroup");

    const loginFullName =
        document.getElementById("loginFullName");

    // =========================
    // MESSAGES
    // =========================

    function showMessage(text, type = "error") {
        message.textContent = text;
        message.className = `message show ${type}`;
    }

    function clearMessage() {
        message.textContent = "";
        message.className = "message";
    }

    function setLoginButton(text, disabled = false) {
        loginButton.textContent = text;
        loginButton.disabled = disabled;
    }

    function setSignupButton(text, disabled = false) {
        signupButton.textContent = text;
        signupButton.disabled = disabled;
    }

    function dashboardUrl() {
        return `customer-dashboard.html?store=${encodeURIComponent(currentStore.slug)}`;
    }

    function storeUrl() {
        return `store.html?store=${encodeURIComponent(currentStore.slug)}`;
    }

    // =========================
    // LOAD STORE
    // =========================

    async function loadStore() {
        if (!storeSlug) {
            showMessage("Store link is missing.");
            return false;
        }

        const { data, error } = await supabaseClient
            .from("stores")
            .select("id, name, slug, status, is_active")
            .eq("slug", storeSlug)
            .maybeSingle();

        if (error) {
            console.error("Store loading error:", error);
            showMessage("Unable to load this store.");
            return false;
        }

        if (!data || data.status !== "ACTIVE" || data.is_active !== true) {
            showMessage("This store is currently unavailable.");
            return false;
        }

        currentStore = data;
        storeName.textContent = data.name;
        backToStore.href = storeUrl();

        return true;
    }

    // =========================
    // CUSTOMER RECORD
    // =========================

    async function connectCustomer(fullName = "") {
        const params = {
            p_store_slug: currentStore.slug
        };

        if (fullName) {
            params.p_full_name = fullName;
        }

        return await supabaseClient.rpc(
            "create_store_customer",
            params
        );
    }

    function requestCustomerName() {
        nameCompletionRequired = true;
        loginFullNameGroup.style.display = "block";
        loginFullName.required = true;
        loginFullName.focus();

        showMessage(
            "Please enter your full name to finish setting up your customer account."
        );

        setLoginButton("Continue", false);
    }

    async function finishNameCompletion() {
        const fullName = loginFullName.value.trim();

        if (!fullName) {
            showMessage("Please enter your full name.");
            loginFullName.focus();
            setLoginButton("Continue", false);
            return;
        }

        setLoginButton("Saving...", true);
        clearMessage();

        try {
            const { data: sessionData, error: sessionError } =
                await supabaseClient.auth.getSession();

            if (sessionError || !sessionData.session) {
                nameCompletionRequired = false;
                loginFullNameGroup.style.display = "none";
                loginFullName.required = false;

                showMessage(
                    "Your session has expired. Please log in again."
                );

                setLoginButton("Login", false);
                return;
            }

            const { error } = await connectCustomer(fullName);

            if (error) {
                console.error("Saving customer name failed:", error);
                showMessage(
                    error.message ||
                    "Unable to save your name. Please try again."
                );

                setLoginButton("Continue", false);
                return;
            }

            nameCompletionRequired = false;

            showMessage(
                "Your account is ready. Opening your dashboard...",
                "success"
            );

            setTimeout(() => {
                window.location.href = dashboardUrl();
            }, 700);

        } catch (error) {
            console.error("Name completion error:", error);
            showMessage("Something went wrong. Please try again.");
            setLoginButton("Continue", false);
        }
    }

    // =========================
    // CHECK EXISTING SESSION
    // =========================

    async function checkExistingSession() {
        const { data, error } =
            await supabaseClient.auth.getSession();

        if (error || !data.session || !currentStore) {
            return;
        }

        const { error: customerError } = await connectCustomer();

        if (customerError) {
            console.error(
                "Existing customer setup error:",
                customerError
            );

            if (
                customerError.message?.includes("Your name is required")
            ) {
                requestCustomerName();
                return;
            }

            showMessage(
                customerError.message ||
                "Unable to connect your account to this store."
            );

            return;
        }

        showMessage(
            "You're already logged in. Opening your dashboard...",
            "success"
        );

        setTimeout(() => {
            window.location.href = dashboardUrl();
        }, 700);
    }

    // =========================
    // LOGIN
    // =========================

    loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearMessage();

        if (!currentStore) {
            showMessage("Store information is not available.");
            return;
        }

        // If the name field is already open, complete the
        // authenticated customer's profile instead of logging in again.
        if (nameCompletionRequired) {
            await finishNameCompletion();
            return;
        }

        const email =
            document.getElementById("loginEmail").value.trim();

        const password =
            document.getElementById("loginPassword").value;

        setLoginButton("Logging in...", true);

        try {
            const { data, error } =
                await supabaseClient.auth.signInWithPassword({
                    email,
                    password
                });

            if (error) {
                console.error("Login error:", error);

                const needsConfirmation =
                    error.code === "email_not_confirmed" ||
                    error.message?.toLowerCase().includes(
                        "email not confirmed"
                    );

                if (needsConfirmation) {
                    resendConfirmationButton.style.display = "block";

                    showMessage(
                        "Your email is not confirmed yet. Click below to request a new confirmation email."
                    );
                } else {
                    resendConfirmationButton.style.display = "none";
                    showMessage(error.message || "Login failed.");
                }

                setLoginButton("Login", false);
                return;
            }

            resendConfirmationButton.style.display = "none";

            const { error: customerError } = await connectCustomer();

            if (customerError) {
                console.error("Customer setup error:", customerError);

                if (
                    customerError.message?.includes("Your name is required")
                ) {
                    requestCustomerName();
                    return;
                }

                showMessage(
                    customerError.message ||
                    "We couldn't connect your account to this store."
                );

                setLoginButton("Login", false);
                return;
            }

            showMessage(
                "Login successful. Opening your dashboard...",
                "success"
            );

            setTimeout(() => {
                window.location.href = dashboardUrl();
            }, 700);

        } catch (error) {
            console.error("Login error:", error);
            showMessage("Something went wrong. Please try again.");
            setLoginButton("Login", false);
        }
    });

    // =========================
    // SIGN UP
    // =========================

    signupForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearMessage();

        if (!currentStore) {
            showMessage("Store information is not available.");
            return;
        }

        setSignupButton("Creating account...", true);

        const fullName =
            document.getElementById("fullName").value.trim();

        const email =
            document.getElementById("signupEmail").value.trim();

        const phone =
            document.getElementById("phone").value.trim();

        const address =
            document.getElementById("address").value.trim();

        const password =
            document.getElementById("signupPassword").value;

        try {
            const { data, error } = await supabaseClient.auth.signUp({
                email,
                password,
                options: {
                    data: {
                        full_name: fullName,
                        phone,
                        address
                    },
                    emailRedirectTo:
                        `${window.location.origin}${window.location.pathname}?store=${encodeURIComponent(currentStore.slug)}`
                }
            });

            if (error) {
                console.error("Signup error:", error);
                showMessage(error.message || "Account creation failed.");
                setSignupButton("Create Account", false);
                return;
            }

            if (!data.session) {
                showMessage(
                    "Account created. Check your email to confirm your account, then log in.",
                    "success"
                );

                setSignupButton("Create Account", false);
                return;
            }

            const { error: customerError } =
                await supabaseClient.rpc("create_store_customer", {
                    p_store_slug: currentStore.slug,
                    p_full_name: fullName,
                    p_phone: phone,
                    p_address: address
                });

            if (customerError) {
                console.error(
                    "Customer creation error:",
                    customerError
                );

                showMessage(
                    customerError.message ||
                    "Your account was created, but we couldn't connect it to this store. Please log in to try again."
                );

                setSignupButton("Create Account", false);
                return;
            }

            showMessage(
                "Account created successfully. Opening your dashboard...",
                "success"
            );

            setTimeout(() => {
                window.location.href = dashboardUrl();
            }, 700);

        } catch (error) {
            console.error("Signup error:", error);
            showMessage("Something went wrong. Please try again.");
            setSignupButton("Create Account", false);
        }
    });

    // =========================
    // RESEND CONFIRMATION EMAIL
    // =========================

    resendConfirmationButton.addEventListener("click", async () => {
        clearMessage();

        const email =
            document.getElementById("loginEmail").value.trim();

        if (!email) {
            showMessage("Enter your email in the Login form first.");
            document.getElementById("loginEmail").focus();
            return;
        }

        if (!currentStore) {
            showMessage("Store information is not available.");
            return;
        }

        resendConfirmationButton.disabled = true;
        resendConfirmationButton.textContent = "Sending...";

        try {
            const { error } = await supabaseClient.auth.resend({
                type: "signup",
                email,
                options: {
                    emailRedirectTo:
                        `${window.location.origin}${window.location.pathname}?store=${encodeURIComponent(currentStore.slug)}`
                }
            });

            if (error) {
                console.error("Resend confirmation error:", error);
                showMessage(
                    error.message ||
                    "Unable to resend the confirmation email."
                );
            } else {
                showMessage(
                    "If this account needs confirmation, a new email has been requested. Check your inbox and spam folder.",
                    "success"
                );
            }

        } catch (error) {
            console.error("Resend confirmation error:", error);
            showMessage("Something went wrong. Please try again.");
        } finally {
            resendConfirmationButton.disabled = false;
            resendConfirmationButton.textContent =
                "Resend Confirmation Email";
        }
    });

    // =========================
    // TABS
    // =========================

    loginTab.addEventListener("click", () => {
        loginTab.classList.add("active");
        signupTab.classList.remove("active");

        loginForm.classList.remove("hidden");
        signupForm.classList.add("hidden");

        clearMessage();
    });

    signupTab.addEventListener("click", () => {
        signupTab.classList.add("active");
        loginTab.classList.remove("active");

        signupForm.classList.remove("hidden");
        loginForm.classList.add("hidden");

        clearMessage();
    });

    // =========================
    // INITIALIZE
    // =========================

    async function initialize() {
        const loaded = await loadStore();

        if (!loaded) {
            return;
        }

        await checkExistingSession();
    }

    initialize();
</script>


</body>

</html>
