<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Customer Account</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(
                    circle at top left,
                    #333 0,
                    #111 35%,
                    #050505 75%
                );
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .auth-container {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand p {
            margin-top: 7px;
            color: #aaa;
            font-size: 14px;
        }

        .auth-card {
            background: #fff;
            color: #111;
            border-radius: 22px;
            padding: 32px;
            box-shadow:
                0 25px 70px rgba(0,0,0,.35);
        }

        .store-name {
            text-align: center;
            font-size: 13px;
            color: #777;
            margin-bottom: 24px;
        }

        .tabs {
            display: flex;
            background: #f2f2f2;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .tab {
            flex: 1;
            border: none;
            background: transparent;
            padding: 11px;
            border-radius: 9px;
            font-weight: 700;
            cursor: pointer;
            color: #777;
        }

        .tab.active {
            background: #111;
            color: #fff;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 11px;
            padding: 13px 14px;
            font-size: 14px;
            outline: none;
            transition: .2s;
        }

        input:focus {
            border-color: #111;
            box-shadow: 0 0 0 3px rgba(0,0,0,.06);
        }

        .submit-btn {
            width: 100%;
            border: none;
            border-radius: 12px;
            background: #111;
            color: #fff;
            padding: 14px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 5px;
        }

        .submit-btn:hover {
            opacity: .9;
        }

        .submit-btn:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: #fff0f0;
            color: #a00000;
        }

        .message.success {
            background: #effaf1;
            color: #16702a;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #aaa;
            font-size: 13px;
            text-decoration: none;
        }

        .back-link:hover {
            color: #fff;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 500px) {

            body {
                padding: 15px;
            }

            .auth-card {
                padding: 24px 20px;
            }

            .brand h1 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>

<div class="auth-container">

    <div class="brand">

        <h1>Customer Account</h1>

        <p>
            Login to continue shopping
        </p>

    </div>


    <div class="auth-card">

        <div
            class="store-name"
            id="storeName"
        >
            Loading store...
        </div>


        <div class="tabs">

            <button
                type="button"
                class="tab active"
                id="loginTab"
            >
                Login
            </button>

            <button
                type="button"
                class="tab"
                id="signupTab"
            >
                Create Account
            </button>

        </div>


        <div
            class="message"
            id="message"
        ></div>


        <!-- LOGIN -->

        <form id="loginForm">

            <div class="form-group">

                <label for="loginEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="submit-btn"
                id="loginButton"
            >
                Login
            </button>

        </form>


        <!-- SIGN UP -->

        <form
            id="signupForm"
            class="hidden"
        >

            <div class="form-group">

                <label for="fullName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="signupEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="08012345678"
                    required
                >

            </div>


            <div class="form-group">

                <label for="address">
                    Delivery Address
                </label>

                <input
                    type="text"
                    id="address"
                    placeholder="Your delivery address"
                    required
                >

            </div>


            <div class="form-group">

                <label for="signupPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="At least 6 characters"
                    minlength="6"
                    required
                >

            </div>


            <button
                type="submit"
                class="submit-btn"
                id="signupButton"
            >
                Create Account
            </button>

        </form>


        <a
            href="#"
            class="back-link"
            id="backToStore"
        >
            ← Back to store
        </a>

    </div>

</div>


<script>

    /* =====================================================
       SUPABASE
       ===================================================== */

    const SUPABASE_URL =
        "https://difamwnbnfjevvgcprig.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_pETuvhi__8zgCn2_Vc19BQ_IeW2PfLl";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY,
            {
                auth: {
                    persistSession: true,
                    autoRefreshToken: true,
                    detectSessionInUrl: true
                }
            }
        );


    /* =====================================================
       STORE
       ===================================================== */

    const urlParams =
        new URLSearchParams(
            window.location.search
        );

    const storeSlug =
        urlParams.get("store");


    let currentStore = null;


    /* =====================================================
       ELEMENTS
       ===================================================== */

    const storeName =
        document.getElementById("storeName");

    const message =
        document.getElementById("message");

    const loginTab =
        document.getElementById("loginTab");

    const signupTab =
        document.getElementById("signupTab");

    const loginForm =
        document.getElementById("loginForm");

    const signupForm =
        document.getElementById("signupForm");

    const loginButton =
        document.getElementById("loginButton");

    const signupButton =
        document.getElementById("signupButton");

    const backToStore =
        document.getElementById("backToStore");


    /* =====================================================
       MESSAGE
       ===================================================== */

    function showMessage(
        text,
        type = "error"
    ) {

        message.textContent = text;

        message.className =
            `message show ${type}`;

    }


    function clearMessage() {

        message.textContent = "";

        message.className =
            "message";

    }


    /* =====================================================
       LOAD STORE
       ===================================================== */

    async function loadStore() {

        if (!storeSlug) {

            showMessage(
                "Store link is missing."
            );

            return false;

        }


        const {
            data,
            error
        } =
            await supabaseClient
                .from("stores")
                .select(`
                    id,
                    name,
                    slug,
                    status,
                    is_active
                `)
                .eq(
                    "slug",
                    storeSlug
                )
                .maybeSingle();


        if (error) {

            console.error(
                "Store loading error:",
                error
            );

            showMessage(
                "Unable to load this store."
            );

            return false;

        }


        if (
            !data ||
            data.status !== "ACTIVE" ||
            data.is_active !== true
        ) {

            showMessage(
                "This store is currently unavailable."
            );

            return false;

        }


        currentStore = data;

        storeName.textContent =
            data.name;

        backToStore.href =
            `store.html?store=${encodeURIComponent(
                data.slug
            )}`;

        return true;

    }


    /* =====================================================
       CHECK EXISTING SESSION
       ===================================================== */

    async function checkExistingSession() {

        const {
            data: {
                session
            }
        } =
            await supabaseClient.auth.getSession();


        if (!session) {
            return;
        }


        /*
         * The customer may already be logged in.
         * We still make sure they have a customer
         * record for THIS store.
         */

        if (!currentStore) {
            return;
        }


        const {
            data,
            error
        } =
            await supabaseClient
                .rpc(
                    "create_store_customer",
                    {
                        p_store_slug:
                            currentStore.slug
                    }
                );


        if (error) {

            console.error(
                "Customer record error:",
                error
            );

            return;

        }


        if (data) {

            showMessage(
                "You're already logged in. Returning to the store...",
                "success"
            );

            setTimeout(
                () => {

                    window.location.href =
                        `store.html?store=${encodeURIComponent(
                            currentStore.slug
                        )}`;

                },
                700
            );

        }

    }


    /* =====================================================
       LOGIN
       ===================================================== */

    loginForm.addEventListener(
        "submit",
        async event => {

            event.preventDefault();

            clearMessage();

            loginButton.disabled = true;

            loginButton.textContent =
                "Logging in...";


            const email =
                document
                    .getElementById(
                        "loginEmail"
                    )
                    .value
                    .trim();

            const password =
                document
                    .getElementById(
                        "loginPassword"
                    )
                    .value;


            const {
                data,
                error
            } =
                await supabaseClient.auth.signInWithPassword(
                    {
                        email,
                        password
                    }
                );


            if (error) {

                console.error(
                    "Login error:",
                    error
                );

                showMessage(
                    error.message ||
                    "Login failed."
                );

                loginButton.disabled = false;

                loginButton.textContent =
                    "Login";

                return;

            }


            /*
             * Create / update this customer's
             * record for the current store.
             */

            const {
                error: customerError
            } =
                await supabaseClient
                    .rpc(
                        "create_store_customer",
                        {
                            p_store_slug:
                                currentStore.slug
                        }
                    );


            if (customerError) {

                console.error(
                    "Customer setup error:",
                    customerError
                );

                await supabaseClient.auth.signOut();

                showMessage(
                    "We couldn't connect your account to this store."
                );

                loginButton.disabled = false;

                loginButton.textContent =
                    "Login";

                return;

            }


            showMessage(
                "Login successful. Returning to the store...",
                "success"
            );


            setTimeout(
                () => {

                    window.location.href =
                        `store.html?store=${encodeURIComponent(
                            currentStore.slug
                        )}`;

                },
                700
            );

        }
    );


    /* =====================================================
       SIGN UP
       ===================================================== */

    signupForm.addEventListener(
        "submit",
        async event => {

            event.preventDefault();

            clearMessage();

            signupButton.disabled = true;

            signupButton.textContent =
                "Creating account...";


            const fullName =
                document
                    .getElementById(
                        "fullName"
                    )
                    .value
                    .trim();

            const email =
                document
                    .getElementById(
                        "signupEmail"
                    )
                    .value
                    .trim();

            const phone =
                document
                    .getElementById(
                        "phone"
                    )
                    .value
                    .trim();

            const address =
                document
                    .getElementById(
                        "address"
                    )
                    .value
                    .trim();

            const password =
                document
                    .getElementById(
                        "signupPassword"
                    )
                    .value;


            /*
             * Create Supabase Auth account.
             */

            const {
                data,
                error
            } =
                await supabaseClient.auth.signUp(
                    {
                        email,
                        password
                    }
                );


            if (error) {

                console.error(
                    "Signup error:",
                    error
                );

                showMessage(
                    error.message ||
                    "Account creation failed."
                );

                signupButton.disabled = false;

                signupButton.textContent =
                    "Create Account";

                return;

            }


            /*
             * Depending on Supabase email
             * confirmation settings, session may
             * or may not exist immediately.
             */

            if (!data.session) {

                showMessage(
                    "Account created. Please check your email to confirm your account, then log in.",
                    "success"
                );

                signupButton.disabled = false;

                signupButton.textContent =
                    "Create Account";

                return;

            }


            /*
             * Create the store-specific customer
             * record through our secure RPC.
             */

            const {
                error: customerError
            } =
                await supabaseClient
                    .rpc(
                        "create_store_customer",
                        {
                            p_store_slug:
                                currentStore.slug,

                            p_full_name:
                                fullName,

                            p_phone:
                                phone,

                            p_address:
                                address
                        }
                    );


            if (customerError) {

                console.error(
                    "Customer creation error:",
                    customerError
                );

                await supabaseClient.auth.signOut();

                showMessage(
                    "Your account was created, but we couldn't connect it to this store. Please try logging in again."
                );

                signupButton.disabled = false;

                signupButton.textContent =
                    "Create Account";

                return;

            }


            showMessage(
                "Account created successfully. Returning to the store...",
                "success"
            );


            setTimeout(
                () => {

                    window.location.href =
                        `store.html?store=${encodeURIComponent(
                            currentStore.slug
                        )}`;

                },
                700
            );

        }
    );


    /* =====================================================
       TABS
       ===================================================== */

    loginTab.addEventListener(
        "click",
        () => {

            loginTab.classList.add(
                "active"
            );

            signupTab.classList.remove(
                "active"
            );

            loginForm.classList.remove(
                "hidden"
            );

            signupForm.classList.add(
                "hidden"
            );

            clearMessage();

        }
    );


    signupTab.addEventListener(
        "click",
        () => {

            signupTab.classList.add(
                "active"
            );

            loginTab.classList.remove(
                "active"
            );

            signupForm.classList.remove(
                "hidden"
            );

            loginForm.classList.add(
                "hidden"
            );

            clearMessage();

        }
    );


    /* =====================================================
       INITIALIZE
       ===================================================== */

    async function initialize() {

        const loaded =
            await loadStore();


        if (!loaded) {
            return;
        }


        await checkExistingSession();

    }


    initialize();

</script>

</body>

</html>
