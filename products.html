
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore our complete product collection.">
    <title>All Products</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <header id="site-header">
        <!-- Reuse the existing website navigation here -->
    </header>

    <main class="products-page">
        <section class="products-heading">
            <p class="eyebrow">OUR COLLECTION</p>
            <h1>Explore All Products</h1>
            <p>Discover everything available in our store.</p>
        </section>

        <section class="products-toolbar">
            <div class="products-search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input
                    type="search"
                    id="product-search"
                    placeholder="Search products..."
                    aria-label="Search products"
                >
            </div>

            <select id="category-filter" aria-label="Filter by category">
                <option value="">All Categories</option>
            </select>
        </section>

        <p id="products-count" aria-live="polite"></p>

        <section id="products-grid" class="products-grid">
            <p id="products-loading">Loading products...</p>
        </section>

        <p id="products-empty" hidden>
            No products found.
        </p>
    </main>

    <footer id="site-footer">
        <!-- Reuse the existing website footer here -->
    </footer>

    <script src="products.js"></script>
</body>
</html>
